# Jetson Orin NX profile (target: M1+). Pinned (revision 2026-10-23):
# JetPack 7 / L4T r39.2.1, TensorRT 10.16, CUDA 13, Yocto image from
# orin-nx-camera-viber (yocto/kas), dual VC MIPI IMX296 sensors.
# Record the exact flashed versions here once the board is up.
platform = "jetson"
zero_copy = "strict"

[source]
kind = "argus" # M1: nvarguscamerasrc into NVMM (see crates/platform-jetson launch.rs); direct libargus replaces it later
width = 1440 # IMX296 native
height = 1080
fps = 30
pool_size = 8 # sim semantics; on device the Argus pool is fixed — see the in-flight budget in design.md (round 3, L2)
gain_max = 16.0 # cap AE brightness swings (reference product's value)

[model]
# YOLOX (Apache-2.0) is the device default; Ultralytics YOLOv8
# weights are AGPL-3.0 and stay sim/test-only (round 3, L9).
# Provenance: Megvii YOLOX-tiny via the reference model importer.
path = "models/yolox-tiny.onnx" # .engine is built on-device and cached
decoder = "yolox"
precision = "fp16"
device = "gpu"
input_width = 416
input_height = 416
input_color = "bgr"
input_normalize = "none"
num_classes = 80
score_threshold = 0.3

[encoder]
enabled = true
codec = "H264" # launch builder sets profile=2 (Main); the encoder default is Baseline
hardware = true
bitrate_kbps = 8000
gop_frames = 30

[stream]
metadata_only = false
rtsp_port = 8555 # 8554 belongs to camera-streamer on the same image

[pipeline]
queue_depth = 2 # live source: 4 frames is 133 ms at 30 fps, over the latency budget before any work
