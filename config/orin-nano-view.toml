# Orin Nano 8 GB viewing profile: capture + x264 only, no inference
# (the Jetson preprocessor/engine are not written yet). Watch it with
#   ffplay -fflags nobuffer -flags low_delay -f h264 tcp://<cam>:8555
# Derived from orin-nano-yolo.toml. The Nano has no NVENC, so this is the
# explicit relaxed-mode opt-in: one VIC copy NVMM -> I420, then x264.
# Pin JetPack 7 / L4T r39.2.1 and record the exact versions on the
# board, as for the NX profile.
platform = "jetson"
zero_copy = "relaxed"

[source]
kind = "argus" # nvarguscamerasrc -> NVMM; direct libargus is later
width = 1440 # IMX296 native
height = 1080
fps = 30
pool_size = 8 # sim semantics; the Argus pool is fixed (see docs/jetson-bringup.md)
argus_pool = 6 # measured on the Nano; at queue_depth=1 the static worst case is 8 (queue_depth + 7) against this pool of 6: the app warns instead of refusing
# No gain/exposure ranges here: at-start ranges gave black frames on
# the Nano. Apply them after PLAYING once brightness is checked.

[model]
enabled = false # view only: capture + x264, no TensorRT (not built yet on the Nano)
# YOLOX (Apache-2.0) is the device default. FP16 selects TensorRT
# layer execution; the I/O bindings stay F32.
path = "/data/models/yolox-tiny.onnx"
decoder = "yolox"
precision = "fp16"
device = "gpu"
input_width = 416
input_height = 416
input_color = "bgr"
input_normalize = "none"
num_classes = 80
score_threshold = 0.3

[encoder]
enabled = true
codec = "H264" # software H.265 cannot hold 1440x1080@30 on the Nano
hardware = false # explicit opt-in; strict mode refuses this
bitrate_kbps = 8000
gop_frames = 30

[stream]
metadata_only = false
video_tcp = "0.0.0.0:8555" # raw Annex-B H.264; 8554 is camera-streamer's
web_ui = "0.0.0.0:8080"    # browser page: live video, boxes, counters (README, "Web UI")

[pipeline]
queue_depth = 1 # live source: small queues keep the in-flight budget under Argus
max_idle_ms = 5000
