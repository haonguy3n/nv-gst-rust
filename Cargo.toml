[workspace]
resolver = "2"
members = [
    "crates/conformance",
    "crates/core",
    "crates/pipeline",
    "crates/postproc",
    "crates/sinks",
    "crates/platform-jetson",
    "crates/platform-jetson/nvbuf-sys",
    "crates/platform-jetson/trt-sys",
    "crates/platform-sim",
    "apps/edge-vision",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"
log = "0.4"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
panic = "abort"
