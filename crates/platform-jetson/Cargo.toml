[package]
name = "platform-jetson"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Jetson backend groundwork: media-engine probe and GStreamer launch strings (device runtime lands in M1)"

[features]
# GStreamer runtime (M1 hybrid path). Needs system GStreamer dev
# libraries; runs on the dev PC (videotestsrc/file pipelines) and
# on the Jetson (nvarguscamerasrc pipelines from launch.rs).
gst = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-allocators",
    "dep:nvbuf-sys",
]

# TensorRT inference (T3-T10): the C++ shim of `trt-sys`, the NvBufSurface
# link lines and GStreamer. Needs the Jetson sysroot (TensorRT 10.16,
# CUDA 13.2); see trt-sys/build.rs for the environment variables.
trt = ["gst", "trt-sys/shim", "nvbuf-sys/link"]

# The CUDA preprocessor (T9): a kernel writes the input tensor from the VIC's
# RGBA surface instead of the CPU. Needs nvcc and the EGL headers (build.rs of
# trt-sys); falls back to the CPU writer at run time if CUDA cannot map the surface.
cuda-preprocess = ["trt", "trt-sys/cuda-preprocess"]

[[example]]
name = "gst-capture"
path = "examples/gst_capture.rs"
required-features = ["gst"]

[dependencies]
log.workspace = true
edge-core = { path = "../core" }
nvbuf-sys = { path = "nvbuf-sys", optional = true }
# Plain types without the `trt` feature (the shim is compiled only with it),
# so the TensorRT decisions are tested on a PC.
trt-sys = { path = "trt-sys" }
sha2.workspace = true
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-allocators = { version = "0.25", optional = true }

[lints]
workspace = true
