[package]
name = "platform-jetson"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Jetson backend groundwork: media-engine probe and GStreamer launch strings (device runtime lands in M1)"

[features]
# GStreamer runtime (M1 hybrid path). Needs system GStreamer dev
# libraries; runs on the dev PC (videotestsrc/file pipelines) and
# on the Jetson (nvarguscamerasrc pipelines from launch.rs).
gst = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-allocators"]

[[example]]
name = "gst-capture"
path = "examples/gst_capture.rs"
required-features = ["gst"]

[dependencies]
edge-core = { path = "../core" }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-allocators = { version = "0.25", optional = true }

[lints]
workspace = true
