[package]
name = "edge-vision"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Edge vision pipeline binary: parse config, pick platform, run"

[features]
# Jetson backend: probe + launch strings today, GStreamer runtime
# with M1 device bring-up. Selecting the platform without the
# feature fails with a clear error, not a link error.
jetson = ["dep:platform-jetson", "platform-jetson/gst"]
# TensorRT inference on the Jetson (needs the Jetson sysroot at build time).
trt = ["jetson", "platform-jetson/trt"]
# Real ONNX models in the sim backend (model.path in config).
onnx = ["platform-sim/onnx"]
# RTSP video sink (stream.rtsp_port). Needs the GStreamer RTSP server
# dev package at build time.
rtsp = ["edge-sinks/rtsp"]

[dependencies]
log.workspace = true
edge-core = { path = "../../crates/core" }
edge-pipeline = { path = "../../crates/pipeline" }
edge-postproc = { path = "../../crates/postproc" }
edge-sinks = { path = "../../crates/sinks" }
platform-jetson = { path = "../../crates/platform-jetson", optional = true }
platform-sim = { path = "../../crates/platform-sim" }
anyhow.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }

[lints]
workspace = true
